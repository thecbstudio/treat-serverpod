<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the value of `--base-href` at build time. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>treat. — free treats for students, real local reach for places</title>
  <meta name="description" content="Students get free treats from local places, post about them, and Claude checks the post. Places get real local reach. Built with Flutter + Serverpod.">
  <meta name="theme-color" content="#E8532B">

  <!-- Link previews (WhatsApp, Instagram DMs, Slack, X) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="treat. — free treats, real local reach">
  <meta property="og:description" content="Claim a free treat, post about the place, Claude verifies it — live on both phones.">
  <meta property="og:image" content="og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="treat.">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #FAF6F0; }
    /* Branded splash until Flutter draws its first frame. */
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #EF6A3F, #E8532B 55%, #CF4522);
      color: #FFFAF5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .35s ease;
    }
    #splash .mark { font-size: 64px; font-weight: 900; letter-spacing: -2px; }
    #splash .tag { margin-top: 6px; font-size: 15px; opacity: .88; }
    #splash .dots { margin-top: 28px; display: flex; gap: 8px; }
    #splash .dots span {
      width: 9px; height: 9px; border-radius: 50%; background: #FFFAF5;
      animation: pulse 1s infinite ease-in-out;
    }
    #splash .dots span:nth-child(2) { animation-delay: .15s; }
    #splash .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse { 0%, 100% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
    #splash.gone { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading treat">
    <div class="mark">treat.</div>
    <div class="tag">free treats · real local reach</div>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('gone');
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
